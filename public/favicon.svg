<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sashaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle (Dark Obsidian) -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>

  <!-- Vibrant Outer Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#sashaGrad)" stroke-width="18" filter="url(#shadow)"/>

  <!-- Stylized Monogram S -->
  <path d="M 320 180 C 320 140 285 125 256 125 C 215 125 185 145 185 185 C 185 240 325 245 325 320 C 325 365 285 387 256 387 C 210 387 180 355 180 320" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Signature Orange Dot -->
  <circle cx="340" cy="140" r="22" fill="url(#sashaGrad)"/>
</svg>
